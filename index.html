<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal Dashboard — focus timer, to-do list, and quick links." />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="container">

    <!-- ===== TOP BAR ===== -->
    <div class="topbar">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span class="icon" id="themeIcon">🌙</span>
        <span id="themeLabel">Dark Mode</span>
      </button>
    </div>

    <!-- ===== GREETING ===== -->
    <section class="greeting-section grid-full" aria-label="Greeting">
      <div class="time" id="currentTime">--:--:-- --</div>
      <div class="date" id="currentDate">Loading...</div>
      <div class="greeting-text" id="greetingText">Hello! 👋</div>

      <div class="name-area">
        <!-- Show name (click to edit) -->
        <div class="name-display" id="nameDisplay" role="button" tabindex="0" aria-label="Edit your name"
          title="Click to change your name">
          <span id="nameShown">Set your name</span>
          <span class="edit-icon">✏️</span>
        </div>

        <!-- Edit name input -->
        <div class="name-input-group" id="nameInputGroup">
          <input
            type="text"
            id="nameInput"
            placeholder="Enter your name…"
            maxlength="40"
            aria-label="Your name"
          />
          <button class="btn-save-name" id="saveNameBtn">Save</button>
        </div>
      </div>
    </section>

    <!-- ===== MAIN GRID ===== -->
    <div class="grid">

      <!-- ===== FOCUS TIMER ===== -->
      <section class="card" aria-label="Focus Timer">
        <h2 class="section-title"><span class="icon">⏱️</span> Focus Timer</h2>

        <div class="timer-display">
          <div class="timer-circle" id="timerCircle">
            <div class="timer-time" id="timerDisplay">25:00</div>
            <div class="timer-label" id="timerLabel">25 min focus</div>
          </div>
        </div>

        <div class="timer-controls">
          <button class="btn btn-success" id="startBtn">▶ Start</button>
          <button class="btn btn-warning" id="stopBtn">⏸ Pause</button>
          <button class="btn btn-ghost" id="resetBtn">↺ Reset</button>
        </div>

        <!-- Challenge: Change Pomodoro time -->
        <div class="timer-duration">
          <label for="durationInput">Set custom duration:</label>
          <div class="duration-controls">
            <input
              type="number"
              id="durationInput"
              value="25"
              min="1"
              max="180"
              aria-label="Timer duration in minutes"
            />
            <span>min</span>
            <button class="btn btn-primary btn-sm" id="applyDurationBtn">Apply</button>
          </div>
        </div>
      </section>

      <!-- ===== TO-DO LIST ===== -->
      <section class="card" aria-label="To-Do List">
        <h2 class="section-title"><span class="icon">✅</span> To-Do List</h2>

        <div class="todo-add">
          <input
            type="text"
            id="todoInput"
            placeholder="Add a new task…"
            maxlength="120"
            aria-label="New task"
          />
          <button class="btn btn-primary" id="addTodoBtn">Add</button>
        </div>

        <!-- Challenge: Sort tasks -->
        <div class="todo-controls">
          <div class="todo-sort">
            <label for="sortSelect">Sort:</label>
            <select id="sortSelect" aria-label="Sort tasks">
              <option value="default">Default</option>
              <option value="az">A → Z</option>
              <option value="za">Z → A</option>
              <option value="pending">Pending first</option>
              <option value="done">Done first</option>
            </select>
          </div>
          <span class="todo-stats" id="todoCount">0 tasks</span>
        </div>

        <ul class="todo-list" id="todoList" aria-live="polite"></ul>
      </section>

      <!-- ===== QUICK LINKS ===== -->
      <section class="card grid-full" aria-label="Quick Links">
        <h2 class="section-title"><span class="icon">🔗</span> Quick Links</h2>

        <div class="links-add">
          <input
            type="text"
            id="linkName"
            placeholder="Name (e.g. YouTube)"
            maxlength="30"
            aria-label="Link name"
          />
          <input
            type="url"
            id="linkUrl"
            placeholder="URL (e.g. youtube.com)"
            maxlength="300"
            aria-label="Link URL"
          />
          <button class="btn btn-primary" id="addLinkBtn">Add Link</button>
        </div>

        <div class="links-grid" id="linksGrid"></div>
      </section>

    </div><!-- /grid -->
  </div><!-- /container -->

  <script src="js/app.js"></script>
</body>
</html>
